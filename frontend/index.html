<body>
<h1>Frontend (Nginx)</h1>
<div id="msg">Loading...</div>
<script>
fetch('/api/status')
.then(r => r.json())
.then(d => { document.getElementById('msg').innerText =
d.message; })
.catch(e => { document.getElementById('msg').innerText = 'API error: ' + e; })
</script>


<input id="q" placeholder="Search Finna...">
  <button id="go">Search</button>
  <ul id="results"></ul>

<script>
    const msg = document.getElementById('msg');

    fetch('/api/status')
      .then(r => r.json())
      .then(d => { msg.innerText = d.message; })
      .catch(e => { msg.innerText = 'API error: ' + e; });

    document.getElementById('go').addEventListener('click', async () => {
      const q = document.getElementById('q').value;
      const list = document.getElementById('results');
      list.innerHTML = '';
      msg.innerText = 'Searching...';
      try {
        const res = await fetch('/api?q=' + encodeURIComponent(q));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        msg.innerText = data.count + ' results';
        data.records.forEach(rec => {
          const li = document.createElement('li');
          li.textContent = rec.title;
          list.appendChild(li);
        });
      } catch (e) {
        msg.innerText = 'API error: ' + e;
      }
    });
  </script>
