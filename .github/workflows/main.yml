name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile \
            -t ifeanyi9/backend:${{ github.sha }} \
            -t ifeanyi9/backend:latest .

      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile \
            -t ifeanyi9/frontend:${{ github.sha }} \
            -t ifeanyi9/frontend:latest .

      - name: Push images to Docker Hub
        run: |
          docker push ifeanyi9/backend:${{ github.sha }}
          docker push ifeanyi9/frontend:${{ github.sha }}
          docker push ifeanyi9/backend:latest
          docker push ifeanyi9/frontend:latest

      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      - name: Log in to OpenShift
        run: oc login --server="${{ secrets.OPENSHIFT_SERVER }}" --token="${{ secrets.OPENSHIFT_TOKEN }}"

      - name: Select OpenShift project
        run: oc project ${{ secrets.OPENSHIFT_PROJECT }}

      - name: Apply deployment manifests
        run: |
          oc apply -f yaml/frontend-deployment.yaml
          oc apply -f yaml/backend-deployment.yaml

      - name: Update deployments to this build
        run: |
          oc set image deployment/frontend frontend=ifeanyi9/frontend:${{ github.sha }}
          oc set image deployment/backend backend=ifeanyi9/backend:${{ github.sha }}
          oc rollout status deployment/frontend
          oc rollout status deployment/backend


